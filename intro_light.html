<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Js Use Light On and Off</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <h2>What Can JavaScript Do?</h2>

        <p>JavaScript can change HTML attribute values.</p>
       
        <p>In this case JavaScript changes the value of the src (source) attribute of an image.</p>
        <button onclick="document.getElementById('myImage').src='./assets/img/pic_bulbon.gif'">Turn On the Light</button>
        <img src="./assets/img/pic_bulboff.gif" alt="img" id="myImage" style="width:100px;height: auto;"/>
        <button onclick="document.getElementById('myImage').src='./assets/img/pic_bulboff.gif'">Turn On the Light</button>
    </body>
</html>
