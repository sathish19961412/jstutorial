<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Js variables</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
       <p>
        <h3>JavaScript Variables can be declared in 4 ways:</h3>
        Automatically,
        Using var,
        Using let,
        Using const,
       </p>
       <p id="demo">5+7=?</p>
       <input type="button" onclick="Mixed()" value="Change it"/>
       <script>
        function Automatically(){
            x=5;
            y=7;
            z=x+y;
            document.getElementById('demo').innerHTML=z;
        }
        function Variables(){
           var  x=5;
           var  y=7;
           var  z=x+y;
            document.getElementById('demo').innerHTML=z;
        }
        function Lets(){
           let x=5;
           let y=7;
           let z=x+y;
            document.getElementById('demo').innerHTML=z;
        }
        function Consts(){
           const x=5;
           const y=7;
           const z=x+y;
            document.getElementById('demo').innerHTML=z;
        }
        function Mixed()
        {
           const price1=5;
           const price2=7;
           let total=price1+price2;
           document.getElementById('demo').innerHTML=total;
           console.log(total);
        }
       </script>
    </body>
</html>
